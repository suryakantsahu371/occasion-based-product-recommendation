services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: "http://localhost:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 12
      start_period: 20s
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
