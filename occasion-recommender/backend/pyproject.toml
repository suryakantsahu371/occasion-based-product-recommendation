[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "E501"]
"app/taxonomy.py" = ["E501"]
"tests/*" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py311"]
